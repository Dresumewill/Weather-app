<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWise</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-wrap">
        <header>
            <div class="logo-container">
                <span class="logo-icon">☁️</span>
                <h1 class="brand-logo">Weather<span>Wise</span></h1>
            </div>
        </header>

        <main>

            <section class="search-box">
                <input 
                    type="text" 
                    id="city-input"
                    class="search-box-bar"
                    placeholder="Barcelona"
                >
                <button id="search-btn">search</button>
            </section>

            <section class="current-weather" id="weather-result">
                <div class="city-date">
                    <h2 class="city" id="city-name">Barcelona, Spain</h2>
                    <p id="local-time" style="font-size: 20px; color: white; font-weight: bold; margin-bottom: 5px;"></p>
                    <p class="date" id="date">Sunday 28 Dec 2025</p>
                </div>

                <div class="temp-box">
                    <img id="weather-icon" src="https://openweathermap.org/img/wn/01d@2x.png" alt="Weather Icon" style="display: none;">

                    <div class="temp" id="temp">7°c</div>
                    <div class="weather" id="weather-desc">Raining</div>
                </div>

                <div class="weather-details">
                    <div class="detail-card">
                        <span class="label">Humidity</span>
                        <span class="value" id="humidity">35%</span>
                    </div>

                    <div class="detail-card">
                        <span class="label">Wind Speed</span>
                        <span class="value" id="wind-speed">2 km/h</span>
                    </div>
                </div>
            </section>

            <div class="error-msg" id="error-message" style="display: none;">
                <p>City not found. please try again.</p>
            </div>
        </main>
    </div>

    <footer>
    <div class="footer-content">
        <p>&copy; 2025 <span class="brand-name"><strong>WeatherWise</strong></span>. All Rights Reserved.</p>
        <div class="social-links">
            <p>Built with ❤️ by <strong>Ifeyinwa</strong> a Web Developer</p>
        </div>
    </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
